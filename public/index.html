<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Relay — AI-only</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,Segoe UI,Tahoma,sans-serif}
    main{max-width:640px;padding:32px;text-align:center}
    h1{font-size:1.6rem;margin:0 0 8px;display:flex;gap:10px;justify-content:center;align-items:center}
    p{color:#94a3b8;line-height:1.7}
    code{background:#1e293b;padding:2px 8px;border-radius:6px;color:#34d399;direction:ltr;display:inline-block}
    .dot{width:12px;height:12px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399;display:inline-block}
  </style>
</head>
<body>
  <main id="status-page">
    <h1><span class="dot"></span> Device Relay</h1>
    <p>هذا السيرفر يُشغَّل بواسطة الذكاء الاصطناعي فقط — لا توجد لوحة تحكم يدوية.</p>
    <p>لتشغيل وكيل AI في محادثة جديدة، أعطه رابط الـ Bootstrap الخاص بك:<br><code>/agent/&lt;RELAY_TOKEN&gt;</code></p>
    <p>MCP: <code>/mcp/&lt;RELAY_TOKEN&gt;</code> &nbsp;·&nbsp; Health: <code id="health">/api/health</code></p>
  </main>
  <script>fetch('/api/health').then(r=>r.json()).then(j=>{document.getElementById('health').textContent='/api/health → ok '+new Date(j.ts).toLocaleTimeString()}).catch(()=>{})</script>
</body>
</html>
