name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (debug-signed)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DeviceRelay.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceRelay-apk
          path: DeviceRelay.apk

      - name: Publish "latest" GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Device Relay APK (latest)
          body: |
            Auto-built from commit ${{ github.sha }}.
            Download **DeviceRelay.apk**, install on your phone (allow unknown sources), then enable the Accessibility service.
          files: DeviceRelay.apk
          prerelease: false
